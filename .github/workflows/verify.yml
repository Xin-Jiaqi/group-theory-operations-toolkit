name: Verify repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install release checks
        run: python -m pip install -e '.[test]'
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Type check
        run: python -m mypy
      - name: Validate packaged catalog
        run: |
          group-ops --version
          group-ops validate
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Install and validate built wheel
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          group-ops validate
          python -c "from group_theory_operations import load_database; assert not __import__('group_theory_operations').validate_database(load_database())"
