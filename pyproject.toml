[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "group-theory-operations-toolkit"
version = "0.1.0"
description = "Validated crystallographic point-operation data and machine interfaces"
authors = [{name = "Jiaqi Xin"}]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: BSD License"]
dependencies = []

[project.scripts]
group-ops = "group_theory_operations.cli:main"

[project.optional-dependencies]
structure = ["materials-structure-core[io]>=0.0.2,<0.2"]
test = ["build>=1.2,<2", "jsonschema[format]>=4.21,<5", "twine>=5,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/group_theory_operations"]

[tool.hatch.build.targets.wheel.force-include]
"data/group_operations.json" = "group_theory_operations/data/group_operations.json"
"schema/group-operations-v1.schema.json" = "group_theory_operations/schema/group-operations-v1.schema.json"
