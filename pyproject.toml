[build-system]
requires = ["hatchling>=1.25,<1.30"]
build-backend = "hatchling.build"

[project]
name = "group-theory-operations-toolkit"
version = "0.15.0"
description = "Group operations, crystal symmetry, stacking symmetry, and response-tensor screening"
authors = [{name = "Jiaqi Xin"}]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: BSD License"]
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
group-ops = "group_theory_operations.cli:main"

[project.optional-dependencies]
structure = ["materials-structure-core[io]>=0.0.2,<0.2", "spglib>=2.5,<3"]
test = ["ase>=3.23,<4", "build>=1.2,<2", "gemmi>=0.6,<1", "jsonschema[format]>=4.21,<5", "mypy>=1.10", "spglib>=2.5,<3", "twine>=5,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/group_theory_operations"]

[tool.hatch.build.targets.wheel.force-include]
"data/group_operations.json" = "group_theory_operations/data/group_operations.json"
"data/quadratic_field_representations.json" = "group_theory_operations/data/quadratic_field_representations.json"
"data/crystallographic_point_groups.json" = "group_theory_operations/data/crystallographic_point_groups.json"
"data/optical_response_invariants.json" = "group_theory_operations/data/optical_response_invariants.json"
"data/crystallographic_space_groups.json" = "group_theory_operations/data/crystallographic_space_groups.json"
"data/crystallographic_layer_groups.json" = "group_theory_operations/data/crystallographic_layer_groups.json"
"data/magnetic_point_groups.json" = "group_theory_operations/data/magnetic_point_groups.json"
"data/magnetic_layer_groups.json" = "group_theory_operations/data/magnetic_layer_groups.json"
"data/crystallographic_wyckoff_positions.json" = "group_theory_operations/data/crystallographic_wyckoff_positions.json"
"schema/group-operations-v1.schema.json" = "group_theory_operations/schema/group-operations-v1.schema.json"
"schema/quadratic-field-representations-v1.schema.json" = "group_theory_operations/schema/quadratic-field-representations-v1.schema.json"
"schema/crystallographic-point-groups-v1.schema.json" = "group_theory_operations/schema/crystallographic-point-groups-v1.schema.json"
"schema/optical-response-invariants-v1.schema.json" = "group_theory_operations/schema/optical-response-invariants-v1.schema.json"
"schema/crystallographic-space-groups-v1.schema.json" = "group_theory_operations/schema/crystallographic-space-groups-v1.schema.json"
"schema/crystallographic-layer-groups-v1.schema.json" = "group_theory_operations/schema/crystallographic-layer-groups-v1.schema.json"
"schema/magnetic-point-groups-v1.schema.json" = "group_theory_operations/schema/magnetic-point-groups-v1.schema.json"
"schema/magnetic-layer-groups-v1.schema.json" = "group_theory_operations/schema/magnetic-layer-groups-v1.schema.json"
"schema/crystallographic-wyckoff-positions-v1.schema.json" = "group_theory_operations/schema/crystallographic-wyckoff-positions-v1.schema.json"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["materials_structure_core", "spglib"]
ignore_missing_imports = true
